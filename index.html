<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA e iOS Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CHEZ BANK">
    <meta name="theme-color" content="#000000">
    <title>CHEZ BANK</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <!-- Icono genérico de PWA para Apple -->
    <link rel="apple-touch-icon" href="icon-192.jpg">
</head>
<body>
    <div class="safe-area-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="header-info">
                <h1>CHEZ BANK</h1>
                <div class="status-indicator">
                    <span id="status-dot" class="dot green"></span>
                    <span id="status-text">Actualizado</span>
                </div>
            </div>
            <button id="refresh-btn" class="icon-btn" aria-label="Actualizar">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12a9 9 0 11-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
        </header>

        <main>
            <!-- Banner Tasa Anticipada (Oculto por defecto) -->
            <div id="future-rate-banner" class="banner hidden">
                <div class="banner-icon">✨</div>
                <div class="banner-content">
                    <strong>Nueva Tasa para Mañana</strong>
                    <p id="future-rate-text">BCV USD: Bs. 0.00</p>
                </div>
            </div>

            <!-- Calculadora -->
            <section class="card calculator-card glass">
                <div class="calc-header">
                    <h2>Calculadora</h2>
                    <select id="rate-selector" class="ios-select">
                        <option value="bcv_usd">USD BCV</option>
                        <option value="bcv_eur">EUR BCV</option>
                        <option value="binance_buy">USDT Binance (Compra)</option>
                        <option value="binance_sell">USDT Binance (Venta)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Divisa</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">$</span>
                        <input type="number" id="input-divisa" placeholder="0.00" inputmode="decimal">
                    </div>
                </div>

                <div class="swap-container">
                    <button id="swap-btn" class="icon-btn swap-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>
                    </button>
                </div>

                <div class="input-group">
                    <label>Bolívares (VES)</label>
                    <div class="input-wrapper">
                        <span class="currency-symbol">Bs.</span>
                        <input type="number" id="input-ves" placeholder="0.00" inputmode="decimal">
                    </div>
                </div>

                <!-- Opciones Rápidas e IGTF -->
                <div class="calc-options">
                    <div class="quick-chips">
                        <button class="chip" data-val="5">$5</button>
                        <button class="chip" data-val="10">$10</button>
                        <button class="chip" data-val="20">$20</button>
                        <button class="chip" data-val="50">$50</button>
                        <button class="chip" data-val="100">$100</button>
                    </div>
                    <div class="igtf-toggle">
                        <span>IGTF (+3%)</span>
                        <label class="switch">
                            <input type="checkbox" id="igtf-switch">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Dashboard de Mercado -->
            <h2 class="section-title">Mercado</h2>
            
            <div class="market-grid">
                <!-- BCV Card -->
                <div class="card glass market-card clickable" data-copy="bcv">
                    <div class="card-title">🇻🇪 BCV Oficial</div>
                    <div class="rate-row">
                        <span>USD</span>
                        <strong id="bcv-usd-val">--</strong>
                    </div>
                    <div class="rate-row text-muted">
                        <span>EUR</span>
                        <span id="bcv-eur-val">--</span>
                    </div>
                </div>

                <!-- Binance Card -->
                <div class="card glass market-card clickable" data-copy="binance">
                    <div class="card-title">💱 Binance P2P</div>
                    <div class="rate-row">
                        <span>Compra</span>
                        <strong id="binance-buy-val">--</strong>
                    </div>
                    <div class="rate-row text-muted">
                        <span>Venta</span>
                        <span id="binance-sell-val">--</span>
                    </div>
                </div>
            </div>

            <!-- Métrica de Brecha -->
            <section class="card glass gap-card">
                <div class="gap-info">
                    <h3>Brecha Cambiaria</h3>
                    <p>Diferencia entre BCV y Binance</p>
                </div>
                <div class="gap-values">
                    <span id="gap-percent" class="badge">--%</span>
                    <span id="gap-bs" class="gap-detail">Bs. -- por cada $100</span>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">Copiado para WhatsApp</div>

    <script src="app.js"></script>
</body>
</html>
